services:

  mysql:
    image: mysql:8.4
    container_name: cinema-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cinema-backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cinema-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "${PHPMYADMIN_PORT}:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - cinema-backend


  app:
    build:
      context: ./CinemaBooking
      dockerfile: Dockerfile

    container_name: cinema-app
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - cinema-backend


  nginx:
    image: nginx:latest
    container_name: cinema-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - cinema-backend


  prometheus:
    image: prom/prometheus:latest
    container_name: cinema-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - cinema-backend


  loki:
    image: grafana/loki:latest
    container_name: cinema-loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro

    command:
      - -config.file=/etc/loki/local-config.yaml

    networks:
      - cinema-backend


  promtail:
    image: grafana/promtail:latest
    container_name: cinema-promtail
    restart: unless-stopped

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - -config.file=/etc/promtail/config.yml

    depends_on:
      loki:
        condition: service_started

    networks:
      - cinema-backend


  grafana:
    image: grafana/grafana:latest
    container_name: cinema-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - cinema-backend


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cinema-cadvisor
    restart: unless-stopped

    ports:
      - "8082:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
      - cinema-backend


volumes:

  mysql_data:

  grafana_data:


networks:

  cinema-backend:
    driver: bridge